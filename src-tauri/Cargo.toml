[package]
name = "voxlocal"
version = "0.1.0"
description = "Private local voice reading for macOS"
authors = ["VoxLocal"]
edition = "2021"

[lib]
name = "voxlocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
